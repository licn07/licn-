<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LiCN · 名片工具</title>
    <style>
        @font-face {
            font-family: 'LiCN-Custom';
            src: url('Roboto.ttf') format('truetype');
            font-weight: normal; font-style: normal; font-display: swap;
        }

        :root {
            --ios-bg: #F5F5F7;
            --grid-line: rgba(0, 122, 255, 0.05);
            --ios-accent: #007aff;
            --ios-green: #34c759;
            --glass-bg: rgba(255, 255, 255, 0.7);
            --glass-border: rgba(255, 255, 255, 0.8);
            --text-main: #1D1D1F;
            --text-sub: #8e8e93;
            --radius-md: 20px;
            --radius-sm: 12px;
            --smooth-curve: cubic-bezier(0.25, 0.1, 0.25, 1);
        }

        .dark-mode {
            --ios-bg: #050505;
            --grid-line: rgba(255, 255, 255, 0.05);
            --ios-accent: #00CCFF;
            --glass-bg: rgba(28, 28, 30, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-main: #ffffff;
            --text-sub: rgba(255, 255, 255, 0.5);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; font-family: 'LiCN-Custom', -apple-system, sans-serif !important; }

        /* 仅对背景和边框做过渡，文字颜色 (color) 不加 transition 以保证切换速度 */
        body, .section, .icon-btn, .result-card, .modal-content { transition: background 0.25s ease, border-color 0.25s ease; }

        body { 
            background-color: var(--ios-bg);
            background-image: linear-gradient(var(--grid-line) 1px, transparent 1px), linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
            background-size: 30px 30px; background-attachment: fixed; padding: 15px; color: var(--text-main); min-height: 100vh; 
        }

        .container { max-width: 420px; margin: 0 auto; position: relative; }
        .nav-bar { display: flex; align-items: center; justify-content: space-between; margin: 10px 5px 25px; }
        .icon-btn {
            width: 42px; height: 42px; background: var(--glass-bg); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border); border-radius: 14px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--text-main);
        }
        .nav-bar h1 { font-size: 22px; font-weight: 900; letter-spacing: -1px; }

        .mode-icon { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--text-main); position: relative; }
        .dark-mode .mode-icon { background: var(--text-main); box-shadow: -4px -3px 0 0 var(--ios-bg) inset; border: none; }

        .section { background: var(--glass-bg); backdrop-filter: blur(20px) saturate(160%); border: 1px solid var(--glass-border); border-radius: var(--radius-md); padding: 15px; margin-bottom: 15px; }
        
        /* 移除 active 缩放，保持文字不动 */
        .clickable-row { 
            display: flex; align-items: center; justify-content: space-between; 
            cursor: pointer; user-select: none;
        }

        .label-text { font-size: 15px; font-weight: 700; }
        .sub-text { font-size: 11px; color: var(--text-sub); }

        .switch { position: relative; display: inline-block; width: 44px; height: 24px; pointer-events: none; } 
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #d1d1d6; transition: .4s; border-radius: 30px; }
        .slider:before { position: absolute; content: ""; height: 20px; width: 20px; left: 2px; bottom: 2px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--ios-green); }
        input:checked + .slider:before { transform: translateX(20px); }

        .preview-area { display: flex; flex-wrap: wrap; gap: 8px; overflow: hidden; height: 44px; transition: height 0.3s var(--smooth-curve); }
        .preview-box { width: 60px; height: 44px; border-radius: 8px; overflow: hidden; border: 1px solid var(--glass-border); background: rgba(120,120,120,0.1); }
        
        .upload-btn { width: 100%; padding: 14px; border: 1.5px dashed var(--ios-accent); border-radius: var(--radius-sm); color: var(--ios-accent); font-weight: 700; background: rgba(0,122,255,0.03); margin: 15px 0 10px; cursor: pointer; }
        .download-all-btn { width: 100%; padding: 14px; background: var(--ios-green); color: #fff; border: none; border-radius: var(--radius-sm); font-weight: 700; margin-top: 8px; display: none; cursor: pointer; }

        #resultContainer { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-top: 15px; }
        .result-card { background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 14px; padding: 8px; animation: fadeIn 0.4s ease; }

        .settings-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); display: none; z-index: 2000; backdrop-filter: blur(8px); }
        .modal-content { position: absolute; bottom: 30px; left: 15px; right: 15px; background: var(--glass-bg); border-radius: 24px; padding: 20px; border: 1px solid var(--glass-border); animation: slideUp 0.3s var(--smooth-curve); }
        .size-option { display: flex; align-items: center; justify-content: space-between; padding: 16px; border-bottom: 0.5px solid rgba(120,120,120,0.1); font-weight: 700; color: var(--text-main); cursor: pointer; }
        .size-option.active { color: var(--ios-accent); background: rgba(0,122,255,0.05); border-radius: 10px; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes slideUp { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    </style>
</head>
<body>

<div class="container">
    <div class="nav-bar">
        <div class="icon-btn" id="openSettings">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1 2-2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
        </div>
        <h1>名片剪切</h1>
        <div class="icon-btn" onclick="toggleTheme()">
            <div class="mode-icon"></div>
        </div>
    </div>

    <div class="section">
        <div class="clickable-row" id="compressRow">
            <div>
                <p class="label-text">极限压缩模式</p>
                <p class="sub-text">关闭保持原像素</p>
            </div>
            <label class="switch"><input type="checkbox" id="compressToggle"><span class="slider"></span></label>
        </div>
    </div>

    <div class="section">
        <div class="preview-area" id="previewArea"></div>
        <button class="upload-btn" id="uploadBtn">选择名片原图</button>
        <button class="download-all-btn" id="downloadAllBtn">一键批量下载</button>
    </div>

    <div id="resultContainer"></div>
</div>

<div class="settings-overlay" id="settingsOverlay">
    <div class="modal-content">
        <h3 style="margin-bottom:15px; font-size:16px; text-align:center; color:var(--text-sub);">剪切比例</h3>
        <div class="size-option" data-ratio="1.333"><span>标准名片</span><span>4 : 3</span></div>
        <div class="size-option" data-ratio="1.777"><span>横版展示</span><span>16 : 9</span></div>
        <button id="closeBtn" style="width:100%; padding:15px; background:rgba(120,120,120,0.1); border:none; border-radius:14px; margin-top:15px; font-weight:800; color:var(--ios-accent);">确认保存</button>
    </div>
</div>

<script>
    function applyTheme(theme) { document.body.classList.toggle('dark-mode', theme === 'dark'); }
    function toggleTheme() {
        const isDark = document.body.classList.toggle('dark-mode');
        localStorage.setItem('licn-theme', isDark ? 'dark' : 'light');
        if (window.navigator.vibrate) window.navigator.vibrate(5);
    }
    if (localStorage.getItem('licn-theme')) applyTheme(localStorage.getItem('licn-theme'));

    let currentRatio = parseFloat(localStorage.getItem('card-ratio')) || 1.333;
    let selectedFiles = [];
    let processedBlobs = [];

    const overlay = document.getElementById('settingsOverlay');
    const closeSettings = () => { 
        overlay.style.display = 'none'; 
        if(selectedFiles.length > 0) autoProcess(); 
    };
    document.getElementById('openSettings').onclick = () => overlay.style.display = 'block';
    overlay.onclick = (e) => { if (e.target === overlay) closeSettings(); };
    document.getElementById('closeBtn').onclick = closeSettings;

    document.querySelectorAll('.size-option').forEach(opt => {
        if(parseFloat(opt.dataset.ratio).toFixed(2) == currentRatio.toFixed(2)) opt.classList.add('active');
        opt.onclick = () => {
            document.querySelectorAll('.size-option').forEach(o => o.classList.remove('active'));
            opt.classList.add('active');
            currentRatio = parseFloat(opt.dataset.ratio);
            localStorage.setItem('card-ratio', currentRatio);
            if (window.navigator.vibrate) window.navigator.vibrate(5);
        };
    });

    const compressRow = document.getElementById('compressRow');
    const compressToggle = document.getElementById('compressToggle');
    compressRow.onclick = () => {
        compressToggle.checked = !compressToggle.checked;
        if (window.navigator.vibrate) window.navigator.vibrate(5);
        if(selectedFiles.length > 0) autoProcess();
    };

    const fileInput = document.createElement('input');
    fileInput.type = 'file'; fileInput.multiple = true; fileInput.accept = 'image/*';
    document.getElementById('uploadBtn').onclick = () => fileInput.click();
    
    fileInput.onchange = (e) => {
        selectedFiles = Array.from(e.target.files);
        if(selectedFiles.length === 0) return;
        const previewArea = document.getElementById('previewArea');
        previewArea.innerHTML = '';
        selectedFiles.forEach(file => {
            const reader = new FileReader();
            reader.onload = (ev) => {
                previewArea.innerHTML += `<div class="preview-box"><img src="${ev.target.result}" style="width:100%;height:100%;object-fit:cover;"></div>`;
            };
            reader.readAsDataURL(file);
        });
        autoProcess();
    };

    async function autoProcess() {
        const container = document.getElementById('resultContainer');
        const dlBtn = document.getElementById('downloadAllBtn');
        container.innerHTML = ''; processedBlobs = [];

        for(let i = 0; i < selectedFiles.length; i++) {
            const { blob } = await cropImage(selectedFiles[i], compressToggle.checked, currentRatio);
            const url = URL.createObjectURL(blob);
            processedBlobs.push({ blob, name: `LICN_${selectedFiles[i].name}` });
            
            const card = document.createElement('div');
            card.className = 'result-card';
            card.innerHTML = `<img src="${url}" style="width:100%;aspect-ratio:${currentRatio};object-fit:cover;border-radius:8px;margin-bottom:8px;"><p class="info-size">${(blob.size/1024).toFixed(1)} KB</p><a href="${url}" download="LICN_${selectedFiles[i].name}" style="display:block;text-align:center;padding:8px;background:rgba(120,120,120,0.1);border-radius:8px;color:var(--ios-accent);text-decoration:none;font-weight:800;font-size:11px;margin-top:8px;">保存单个</a>`;
            container.appendChild(card);
        }
        dlBtn.style.display = processedBlobs.length > 0 ? 'block' : 'none';
    }

    async function cropImage(file, compress, ratio) {
        return new Promise(resolve => {
            const img = new Image();
            img.src = URL.createObjectURL(file);
            img.onload = () => {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                let sw, sh, sx, sy;
                if (img.width / img.height > ratio) {
                    sh = img.height; sw = img.height * ratio;
                    sx = (img.width - sw) / 2; sy = 0;
                } else {
                    sw = img.width; sh = img.width / ratio;
                    sx = 0; sy = (img.height - sh) / 2;
                }
                canvas.width = compress ? 1000 : sw;
                canvas.height = canvas.width / ratio;
                ctx.drawImage(img, sx, sy, sw, sh, 0, 0, canvas.width, canvas.height);
                canvas.toBlob((blob) => { URL.revokeObjectURL(img.src); resolve({ blob }); }, 'image/jpeg', compress ? 0.6 : 0.92);
            };
        });
    }

    document.getElementById('downloadAllBtn').onclick = () => {
        processedBlobs.forEach((item, index) => {
            setTimeout(() => {
                const a = document.createElement('a');
                a.href = URL.createObjectURL(item.blob);
                a.download = item.name;
                a.click();
            }, index * 250);
        });
    };
</script>
</body>
</html>
