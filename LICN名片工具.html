<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LiCN · 名片工具</title>
    <style>
        @font-face {
            font-family: 'LiCN-Custom';
            src: url('Roboto.ttf') format('truetype');
            font-weight: normal; font-style: normal; font-display: swap;
        }

        :root {
            --ios-bg: #f2f2f7;
            --ios-accent: #007aff;
            --ios-green: #34c759;
            --radius-md: 18px;
            --radius-sm: 12px;
        }

        * {
            margin: 0; padding: 0; box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            font-family: 'LiCN-Custom', -apple-system, sans-serif !important;
        }

        body { background: var(--ios-bg); padding: 12px; color: #000; min-height: 100vh; }
        .container { max-width: 420px; margin: 0 auto; }
        
        .header { margin: 10px 0 15px 5px; }
        .header h1 { font-size: 24px; font-weight: 800; letter-spacing: -0.5px; }

        .section {
            background: #fff; border-radius: var(--radius-md);
            padding: 14px; margin-bottom: 12px;
            box-shadow: 0 1px 10px rgba(0,0,0,0.02);
        }

        .control-row { display: flex; align-items: center; justify-content: space-between; }
        .label-text { font-size: 15px; font-weight: 600; }
        .sub-text { font-size: 11px; color: #8e8e93; }

        /* iOS 开关 */
        .switch { position: relative; display: inline-block; width: 44px; height: 26px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
            background-color: #e9e9eb; transition: .4s; border-radius: 30px;
        }
        .slider:before {
            position: absolute; content: ""; height: 22px; width: 22px; left: 2px; bottom: 2px;
            background-color: white; transition: .4s; border-radius: 50%;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        input:checked + .slider { background-color: var(--ios-green); }
        input:checked + .slider:before { transform: translateX(18px); }

        /* 预览区一排显示 */
        .preview-wrapper { position: relative; margin-bottom: 10px; }
        .preview-area { 
            display: flex; flex-wrap: wrap; gap: 6px; 
            overflow: hidden; height: 42px; 
            transition: height 0.3s ease;
        }
        .preview-area.expanded { height: auto; min-height: 42px; }
        
        .preview-box { width: 55px; height: 42px; border-radius: 6px; overflow: hidden; background: #eee; border: 0.5px solid #ddd; }
        .preview-box img { width: 100%; height: 100%; object-fit: cover; }
        
        .expand-toggle {
            font-size: 11px; color: var(--ios-accent); font-weight: 600;
            margin-top: 5px; display: none; text-align: right; cursor: pointer;
        }

        /* 按钮与状态 */
        .upload-btn {
            width: 100%; padding: 12px; border: 1.2px dashed #c7c7cc; border-radius: var(--radius-sm);
            color: var(--ios-accent); font-size: 14px; margin-bottom: 10px;
            background: #fbfbfd; font-weight: 600; cursor: pointer;
        }

        .status-btn {
            width: 100%; padding: 13px; border: none; border-radius: var(--radius-sm);
            font-size: 15px; font-weight: 700; text-align: center;
            background: #e5e5ea; color: #8e8e93; display: none;
        }
        .status-btn.active { background: var(--ios-accent); color: #fff; display: block; }
        .status-btn.done { background: var(--ios-green); color: #fff; }

        .download-all-btn {
            width: 100%; padding: 13px; border: none; border-radius: var(--radius-sm);
            font-size: 15px; font-weight: 600; text-align: center;
            background: var(--ios-green); color: #fff; margin-top: 10px; display: none;
        }

        /* 结果区域 */
        #resultContainer { 
            display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 15px; 
        }
        .result-card {
            background: #fff; border-radius: 14px; padding: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04); display: flex; flex-direction: column;
        }
        .result-card img { width: 100%; aspect-ratio: 4/3; border-radius: 8px; object-fit: cover; margin-bottom: 6px; }
        
        .info-size { color: var(--ios-green); font-size: 12px; font-weight: 700; }
        .info-time { color: #000; font-size: 9px; font-weight: 500; margin-bottom: 6px; }
        
        .dl-link { 
            display: block; width: 100%; padding: 6px; background: #f2f2f7; border-radius: 6px;
            color: var(--ios-accent); text-decoration: none; font-weight: 700; font-size: 11px; text-align: center;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header"><h1>名片剪切</h1></div>

    <div class="section">
        <div class="control-row">
            <div>
                <p class="label-text">极限压缩模式</p>
                <p class="sub-text">关闭保持原像素 · 4:3</p>
            </div>
            <label class="switch">
                <input type="checkbox" id="compressToggle">
                <span class="slider"></span>
            </label>
        </div>
    </div>

    <div class="section">
        <div class="preview-wrapper">
            <div class="preview-area" id="previewArea"></div>
            <div class="expand-toggle" id="expandToggle">展开预览 ▾</div>
        </div>
        <button class="upload-btn" id="uploadBtn">选择图片 (选完自动处理)</button>
        
        <div id="statusBtn" class="status-btn">准备就绪</div>
        <button id="downloadAllBtn" class="download-all-btn">一键下载所有</button>
    </div>

    <div id="resultContainer"></div>
</div>

<script>
    let selectedFiles = [];
    let processedBlobs = [];

    const uploadBtn = document.getElementById('uploadBtn');
    const statusBtn = document.getElementById('statusBtn');
    const dlBtn = document.getElementById('downloadAllBtn');
    const previewArea = document.getElementById('previewArea');
    const expandToggle = document.getElementById('expandToggle');
    const fileInput = document.createElement('input');
    fileInput.type = 'file'; fileInput.multiple = true; fileInput.accept = 'image/*';
    
    uploadBtn.onclick = () => fileInput.click();
    
    // --- 核心修改：文件改变后立刻自动处理 ---
    fileInput.onchange = async (e) => {
        selectedFiles = Array.from(e.target.files);
        if (selectedFiles.length === 0) return;

        processedBlobs = [];
        dlBtn.style.display = 'none';
        previewArea.innerHTML = '';
        document.getElementById('resultContainer').innerHTML = '';
        
        // 1. 显示预览
        selectedFiles.forEach(file => {
            const reader = new FileReader();
            reader.onload = (ev) => {
                const box = document.createElement('div');
                box.className = 'preview-box';
                box.innerHTML = `<img src="${ev.target.result}">`;
                previewArea.appendChild(box);
            };
            reader.readAsDataURL(file);
        });

        setTimeout(() => {
            expandToggle.style.display = previewArea.scrollHeight > 45 ? 'block' : 'none';
        }, 100);

        // 2. 自动启动处理流程
        await autoProcessAll();
    };

    async function autoProcessAll() {
        const total = selectedFiles.length;
        const isCompress = document.getElementById('compressToggle').checked;
        const container = document.getElementById('resultContainer');
        
        statusBtn.style.display = 'block';
        statusBtn.className = 'status-btn active';
        uploadBtn.style.display = 'none'; // 处理时隐藏上传按钮，防止混乱

        for(let i = 0; i < total; i++) {
            statusBtn.innerText = `正在自动处理 ${i + 1}/${total}`;
            const file = selectedFiles[i];
            const { blob } = await cropImage(file, isCompress);
            const url = URL.createObjectURL(blob);
            const sizeKB = (blob.size / 1024).toFixed(1);
            
            processedBlobs.push({ blob, name: `LICN_${file.name}` });
            
            const d = new Date();
            const timeStr = `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()} ${d.getHours().toString().padStart(2,'0')}:${d.getMinutes().toString().padStart(2,'0')}:${d.getSeconds().toString().padStart(2,'0')}`;
            
            const card = document.createElement('div');
            card.className = 'result-card';
            card.innerHTML = `
                <img src="${url}">
                <p class="info-size">${sizeKB} KB</p>
                <p class="info-time">${timeStr}</p>
                <a href="${url}" download="LICN_${file.name}" class="dl-link">下载单个</a>
            `;
            container.appendChild(card);
            await new Promise(r => setTimeout(r, 10)); // 保证UI平滑更新
        }

        statusBtn.innerText = "处理完成 √";
        statusBtn.className = 'status-btn active done';
        dlBtn.style.display = 'block';
        
        // 3秒后恢复上传按钮，方便下一次操作
        setTimeout(() => {
            uploadBtn.style.display = 'block';
            statusBtn.style.display = 'none';
        }, 3000);
    }

    expandToggle.onclick = () => {
        const isExpanded = previewArea.classList.toggle('expanded');
        expandToggle.innerText = isExpanded ? '收起预览 ▲' : '展开预览 ▾';
    };

    dlBtn.onclick = function() {
        processedBlobs.forEach((item, index) => {
            setTimeout(() => {
                const a = document.createElement('a');
                a.href = URL.createObjectURL(item.blob);
                a.download = item.name;
                a.click();
            }, index * 250);
        });
    };

    async function cropImage(file, compress) {
        return new Promise(resolve => {
            const img = new Image();
            img.src = URL.createObjectURL(file);
            img.onload = () => {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                const targetRatio = 4 / 3;
                let sw, sh, sx, sy;
                if (img.width / img.height > targetRatio) {
                    sh = img.height; sw = img.height * targetRatio;
                    sx = (img.width - sw) / 2; sy = 0;
                } else {
                    sw = img.width; sh = img.width / targetRatio;
                    sx = 0; sy = (img.height - sh) / 2;
                }
                let dw = compress ? 1000 : sw;
                let dh = compress ? (1000 / targetRatio) : sh;
                canvas.width = dw; canvas.height = dh;
                ctx.drawImage(img, sx, sy, sw, sh, 0, 0, dw, dh);
                canvas.toBlob((blob) => resolve({ blob }), 'image/jpeg', compress ? 0.6 : 0.92);
            };
        });
    }
</script>
</body>
</html>
