<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LICN名片工具</title>
    <style>
        @font-face {
            font-family: 'LiCN-Custom';
            src: url('Roboto.ttf') format('truetype');
            font-weight: normal; font-style: normal; font-display: swap;
        }

        :root {
            --ios-bg: #f2f2f7;
            --ios-accent: #007aff;
            --ios-green: #34c759;
            --radius-md: 14px;
        }

        * {
            margin: 0; padding: 0; box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            font-family: 'LiCN-Custom', -apple-system, sans-serif !important;
        }

        body { background: var(--ios-bg); padding: 15px; color: #000; min-height: 100vh; }
        .container { max-width: 500px; margin: 0 auto; }
        
        .header { margin: 25px 0 25px 10px; }
        .header h1 { font-size: 28px; font-weight: 800; letter-spacing: -1px; }

        .section {
            background: #fff; border-radius: var(--radius-md);
            padding: 18px; margin-bottom: 16px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.03);
        }

        .control-row {
            display: flex; align-items: center; justify-content: space-between;
            padding: 10px 0; border-bottom: 0.5px solid #efeff4;
        }
        .control-row:last-child { border-bottom: none; }

        .label-text { font-size: 16px; font-weight: 500; }
        .sub-text { font-size: 12px; color: #8e8e93; font-weight: normal; }

        /* iOS 开关样式 */
        .switch {
            position: relative; display: inline-block; width: 51px; height: 31px;
        }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
            background-color: #e9e9eb; transition: .4s; border-radius: 34px;
        }
        .slider:before {
            position: absolute; content: ""; height: 27px; width: 27px; left: 2px; bottom: 2px;
            background-color: white; transition: .4s; border-radius: 50%;
            box-shadow: 0 3px 8px rgba(0,0,0,0.15);
        }
        input:checked + .slider { background-color: var(--ios-green); }
        input:checked + .slider:before { transform: translateX(20px); }

        .upload-btn {
            width: 100%; padding: 18px; border: 1.5px dashed #c7c7cc; border-radius: 14px;
            color: var(--ios-accent); font-size: 16px; margin: 15px 0;
            background: transparent; font-weight: 600; cursor: pointer;
        }

        .process-btn {
            width: 100%; padding: 16px; border: none; border-radius: 14px;
            font-size: 17px; font-weight: 600; background: var(--ios-accent); color: #fff;
            transition: all 0.2s;
        }
        .process-btn:active { opacity: 0.8; transform: scale(0.98); }

        .preview-area { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
        .preview-box { width: 60px; height: 45px; border-radius: 6px; overflow: hidden; background: #ddd; border: 0.5px solid #ccc; }
        .preview-box img { width: 100%; height: 100%; object-fit: cover; }

        #resultContainer { margin-top: 20px; }
        .result-card {
            background: #fff; border-radius: 14px; padding: 10px; margin-bottom: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); text-align: center;
        }
        .result-card img { width: 100%; border-radius: 8px; display: block; margin-bottom: 10px; }
        .dl-link { color: var(--ios-accent); text-decoration: none; font-weight: 600; font-size: 14px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>名片剪切工具</h1>
    </div>

    <div class="section">
        <div class="control-row">
            <div>
                <div class="label-text">保持原图分辨率</div>
                <div class="sub-text">关闭压缩以维持最高清晰度</div>
            </div>
            <label class="switch">
                <input type="checkbox" id="compressToggle">
                <span class="slider"></span>
            </label>
        </div>
        <div class="control-row">
            <div>
                <div class="label-text">剪切比例</div>
                <div class="sub-text">当前强制锁定为 4:3</div>
            </div>
            <div style="font-weight: 700; color: var(--ios-accent);">4 : 3</div>
        </div>
    </div>

    <div class="section">
        <div class="preview-area" id="previewArea"></div>
        <button class="upload-btn" id="uploadBtn">选择名片原图</button>
        <button class="process-btn" id="processBtn">开始剪切处理</button>
    </div>

    <div id="resultContainer"></div>
</div>

<script>
    let selectedFiles = [];

    // 文件选择逻辑
    const uploadBtn = document.getElementById('uploadBtn');
    const fileInput = document.createElement('input');
    fileInput.type = 'file'; fileInput.multiple = true; fileInput.accept = 'image/*';
    
    uploadBtn.onclick = () => fileInput.click();
    
    fileInput.onchange = (e) => {
        selectedFiles = Array.from(e.target.files);
        const previewArea = document.getElementById('previewArea');
        previewArea.innerHTML = '';
        selectedFiles.forEach(file => {
            const reader = new FileReader();
            reader.onload = (ev) => {
                const box = document.createElement('div');
                box.className = 'preview-box';
                box.innerHTML = `<img src="${ev.target.result}">`;
                previewArea.appendChild(box);
            };
            reader.readAsDataURL(file);
        });
    };

    // 核心处理逻辑
    document.getElementById('processBtn').onclick = async function() {
        if(selectedFiles.length === 0) return alert("请先上传图片");
        
        const isCompress = document.getElementById('compressToggle').checked;
        const container = document.getElementById('resultContainer');
        container.innerHTML = '';
        this.innerText = "处理中...";

        for(let file of selectedFiles) {
            const blob = await cropImage(file, isCompress);
            const url = URL.createObjectURL(blob);
            
            const card = document.createElement('div');
            card.className = 'result-card';
            card.innerHTML = `
                <img src="${url}">
                <a href="${url}" download="CROP_${file.name}" class="dl-link">保存这张名片</a>
            `;
            container.appendChild(card);
        }
        this.innerText = "处理完成";
    };

    async function cropImage(file, compress) {
        return new Promise(resolve => {
            const img = new Image();
            img.src = URL.createObjectURL(file);
            img.onload = () => {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');

                // 目标比例 4:3
                const targetRatio = 4 / 3;
                let finalWidth, finalHeight;

                if (!compress) {
                    // --- 不压缩逻辑：保持原图尺寸 ---
                    // 以原图的长边或宽边为基准，计算出符合 4:3 的最大面积
                    if (img.width / img.height > targetRatio) {
                        // 图片太宽了，以高度为准
                        finalHeight = img.height;
                        finalWidth = img.height * targetRatio;
                    } else {
                        // 图片太高了，以宽度为准
                        finalWidth = img.width;
                        finalHeight = img.width / targetRatio;
                    }
                } else {
                    // --- 压缩逻辑：可以设定一个固定的常用名片像素 ---
                    finalWidth = 1200; 
                    finalHeight = 900;
                }

                canvas.width = finalWidth;
                canvas.height = finalHeight;

                // 计算居中偏移量（从原图中居中切出 4:3）
                const sourceRatio = img.width / img.height;
                let sx, sy, sw, sh;

                if (sourceRatio > targetRatio) {
                    sh = img.height;
                    sw = img.height * targetRatio;
                    sx = (img.width - sw) / 2;
                    sy = 0;
                } else {
                    sw = img.width;
                    sh = img.width / targetRatio;
                    sx = 0;
                    sy = (img.height - sh) / 2;
                }

                ctx.drawImage(img, sx, sy, sw, sh, 0, 0, finalWidth, finalHeight);
                
                // 输出图片
                canvas.toBlob(resolve, 'image/jpeg', 0.95);
            };
        });
    }
</script>

</body>
</html>
