<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LiCN · 中枢</title>
    <style>
        @font-face {
            font-family: 'SF-Pro';
            src: url('Roboto.ttf') format('truetype');
            font-weight: normal; font-style: normal; font-display: swap;
        }

        :root {
            --ios-blue: #007AFF;
            --bg-color: #F5F5F7;
            --grid-line: rgba(0, 122, 255, 0.05);
            --card-bg: rgba(255, 255, 255, 0.7);
            --card-border: rgba(255, 255, 255, 0.8);
            --text-main: #1D1D1F;
            --text-sub: rgba(0, 0, 0, 0.5);
            --shadow: 0 10px 30px rgba(0,0,0,0.03);
            --toggle-bg: rgba(0, 0, 0, 0.05);
        }

        .dark-mode {
            --ios-blue: #00CCFF;
            --bg-color: #050505;
            --grid-line: rgba(255, 255, 255, 0.05);
            --card-bg: rgba(28, 28, 30, 0.7);
            --card-border: rgba(255, 255, 255, 0.1);
            --text-main: #ffffff;
            --text-sub: rgba(255, 255, 255, 0.5);
            --shadow: 0 10px 40px rgba(0,0,0,0.6);
            --toggle-bg: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0; padding: 0; box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            font-family: 'SF-Pro', -apple-system, sans-serif !important;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                linear-gradient(var(--grid-line) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
            background-size: 30px 30px;
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 40px 20px;
        }

        .theme-toggle {
            position: fixed; top: 25px; right: 20px;
            width: 44px; height: 44px;
            background: var(--toggle-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            display: flex; align-items: center; justify-content: center;
            z-index: 100; cursor: pointer;
        }

        .mode-icon {
            width: 18px; height: 18px; border-radius: 50%;
            border: 2px solid var(--text-main); position: relative;
        }
        .dark-mode .mode-icon {
            background: var(--text-main);
            box-shadow: -5px -4px 0 0 var(--bg-color) inset;
            border: none;
        }

        .container { width: 100%; max-width: 420px; position: relative; z-index: 10; }

        .brand-header { text-align: center; margin-bottom: 35px; padding-top: 20px; }
        .brand-title {
            font-size: 2.8rem; font-weight: 900; letter-spacing: -1.5px;
            color: var(--text-main); margin-bottom: 4px;
            background: linear-gradient(to bottom, var(--text-main) 60%, var(--text-sub) 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .brand-subtitle {
            font-size: 0.75rem; font-weight: 700; text-transform: uppercase;
            letter-spacing: 6px; color: var(--ios-blue); margin-left: 6px;
        }

        .status-strip {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 20px;
        }
        .status-node {
            background: var(--card-bg); border: 1px solid var(--card-border);
            border-radius: 12px; padding: 10px 0; font-size: 0.65rem;
            color: var(--text-sub); font-weight: bold; text-align: center;
            box-shadow: var(--shadow);
        }
        .status-node b { color: var(--text-main); display: block; font-size: 0.85rem; margin-top: 2px; }

        .group-label {
            color: var(--text-sub); font-size: 0.75rem; font-weight: 800;
            margin: 25px 0 12px 5px; text-transform: uppercase; letter-spacing: 1px;
            display: flex; justify-content: space-between;
        }

        .grid-box { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
        .grid-box-triple { grid-template-columns: repeat(3, 1fr); } /* 新增三列布局 */
        
        .card {
            background: var(--card-bg); backdrop-filter: blur(30px) saturate(150%);
            -webkit-backdrop-filter: blur(30px) saturate(150%);
            border: 1px solid var(--card-border); border-radius: 20px;
            padding: 24px 10px; display: flex; align-items: center; justify-content: center;
            color: var(--text-main); text-decoration: none; box-shadow: var(--shadow);
            text-align: center; cursor: pointer;
        }
        .card span { font-size: 0.85rem; font-weight: 700; }
        .card:active { transform: scale(0.96); opacity: 0.8; }
    </style>
</head>
<body id="mainBody">

    <div class="theme-toggle" onclick="manualToggle()">
        <div class="mode-icon"></div>
    </div>

    <div class="container">
        <header class="brand-header">
            <div class="brand-title">LiCN · 中枢</div>
            <div class="brand-subtitle">Adaptive</div>
        </header>

        <div class="status-strip">
            <div class="status-node">CPU <b id="cpu">0.0%</b></div>
            <div class="status-node">RAM <b id="ram">0MB</b></div>
            <div class="status-node">MODE <b id="mode-text">LIGHT</b></div>
        </div>

        <div class="group-label">
            <span>Poster Service</span>
            <span style="opacity: 0.5;">海报服务</span>
        </div>
        <!-- 调整为 3 列布局以容纳新按钮 -->
        <div class="grid-box grid-box-triple">
            <div class="card" onclick="location.href='海报自定义工具.html'"><span>自定义</span></div>
            <div class="card" onclick="location.href='海报图库.html'"><span>海报图库</span></div>
            <div class="card" onclick="window.open('https://jcn101cvl5dk.feishu.cn/wiki/D9V4wqJgviIYXuka2KHcUXJ2nie')"><span>云端知识</span></div>
        </div>

        <div class="group-label">
            <span>Card Service</span>
            <span style="opacity: 0.5;">名片服务</span>
        </div>
        <div class="grid-box">
            <div class="card" onclick="location.href='LICN名片工具.html'"><span>名片剪切工具</span></div>
            <div class="card" onclick="location.href='LICN名片图库.html'"><span>进入名片图库</span></div>
        </div>

        <div class="group-label">
            <span>External</span>
            <span style="opacity: 0.5;">王者战力查询</span>
        </div>
        <div class="grid-box">
            <div class="card" style="grid-column: span 2; padding: 20px;" onclick="location.href='https://www.likeuuu.top/'"><span>战力查询工具</span></div>
        </div>
    </div>

    <script>
        function manualToggle() {
            const isDark = document.body.classList.toggle('dark-mode');
            document.getElementById('mode-text').innerText = isDark ? "DARK" : "LIGHT";
            if (window.navigator.vibrate) window.navigator.vibrate(5);
        }

        function updateMetrics() {
            document.getElementById('cpu').innerText = (Math.random() * 2 + 1.2).toFixed(1) + '%';
            document.getElementById('ram').innerText = Math.floor(Math.random() * 30 + 1340) + 'MB';
        }

        setInterval(updateMetrics, 2000);
        updateMetrics();
    </script>
</body>
</html>
