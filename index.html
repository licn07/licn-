<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LiCN · 中枢</title>
    <style>
        @font-face {
            font-family: 'Roboto';
            src: url('Roboto.ttf') format('truetype');
            font-weight: normal; font-style: normal; font-display: swap;
        }
        * {
            margin: 0; padding: 0; box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            outline: none; transition: all 0.3s ease;
            font-family: 'Roboto', sans-serif !important;
        }
        body {
            background: var(--page-bg);
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #particles {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 0;
        }
        .container {
            max-width: 700px; width: 100%; position: relative; z-index: 1;
        }
        header {
            text-align: center;
            position: absolute;
            top: -180px; /* 再往上一半 */
            left: 0;
            right: 0;
        }
        header h1 {
            font-size: 2.2rem; font-weight: 700;
            background: linear-gradient(90deg, #00ccff, #0099ff, #66ccff, #99ffff, #00ccff);
            background-size: 400% 100%;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: flowColor 4s linear infinite;
        }
        @keyframes flowColor {
            0% { background-position: 0% 50%; }
            100% { background-position: 400% 50%; }
        }
        .grid-box {
            display: grid; grid-template-columns: 1fr; gap: 16px;
            opacity: 0;
            animation: fadeInUp 0.8s 0.3s ease forwards;
            margin-top: -6px;
        }
        @media (min-width: 500px) {
            .grid-box { grid-template-columns: 1fr 1fr; }
            .card-main { grid-column: span 2; }
        }
        .card {
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            padding: 24px 20px;
            cursor: pointer; user-select: none;
            text-align: center;
            font-size: 1rem; font-weight: 500;
            color: #000;
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            position: relative; z-index: 2;
        }
        .card-main {
            font-size: 1.1rem; padding: 28px 20px;
        }
        .card:active {
            transform: scale(0.95);
            transition: transform 0.12s ease;
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .shape {
            position: fixed; pointer-events: none; opacity: 0.12; z-index: 0;
            animation: shapeFloat 12s infinite ease-in-out;
        }
        @keyframes shapeFloat {
            0%,100% { transform: translate(0,0) rotate(0deg); }
            33% { transform: translate(20px,-15px) rotate(3deg); }
            66% { transform: translate(-15px,10px) rotate(-2deg); }
        }
        footer { display: none; }
    </style>
</head>
<body>
    <canvas id="particles"></canvas>

    <div class="container">
        <header>
            <h1>LiCN · 中枢</h1>
        </header>

        <div class="grid-box">
            <div class="card card-main" onclick="location.href='海报自定义工具.html'">
                🎨 海报自定义工具
            </div>
            <div class="card" onclick="window.open('https://jcn101cvl5dk.feishu/wiki/D9V4wqJgviIYXuka2KHcUXJ2nie','_blank')">
                🖼️ 我的海报图库
            </div>
            <div class="card" onclick="window.open('https://www.91m.top','_blank')">
                🎮 苏苏荣耀助手（可查战区）
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('particles');
        const ctx = canvas.getContext('2d');
        let w = window.innerWidth, h = window.innerHeight;
        canvas.width = w; canvas.height = h;
        const particles = [];
        const count = 60;

        class Particle {
            constructor(){
                this.x = Math.random()*w;
                this.y = Math.random()*h;
                this.size = Math.random()*1.5+0.5;
                this.speedX = (Math.random()-0.5)*0.4;
                this.speedY = (Math.random()-0.5)*0.4;
                this.opacity = Math.random()*0.25+0.08;
            }
            update(){
                this.x += this.speedX;
                this.y += this.speedY;
                if(this.x<0||this.x>w) this.x = Math.random()*w;
                if(this.y<0||this.y>h) this.y = Math.random()*h;
            }
            draw(){
                ctx.fillStyle = `rgba(255,255,255,${this.opacity})`;
                ctx.beginPath();
                ctx.arc(this.x,this.y,this.size,0,Math.PI*2);
                ctx.fill();
            }
        }
        function init(){ for(let i=0;i<count;i++) particles.push(new Particle()); }
        function anim(){ requestAnimationFrame(anim); ctx.clearRect(0,0,w,h); particles.forEach(p=>{p.update();p.draw()}); }
        init(); anim();

        window.addEventListener('resize',()=>{ w=innerWidth;h=innerHeight; canvas.width=w;canvas.height=h; });

        function createShapes(){
            const colors = ['#fff','#667eea','#764ba2'];
            for(let i=0;i<6;i++){
                let s = document.createElement('div');
                s.className = 'shape';
                s.style.width = Math.random()*25+10+'px';
                s.style.height = Math.random()*25+10+'px';
                s.style.background = colors[Math.floor(Math.random()*colors.length)];
                s.style.borderRadius = Math.random()>0.5 ? '50%' : '4px';
                s.style.left = Math.random()*100+'%';
                s.style.top = Math.random()*100+'%';
                s.style.animationDelay = Math.random()*4+'s';
                document.body.appendChild(s);
            }
        }
        createShapes();
    </script>
