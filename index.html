<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LiCN · 中枢</title>
    <style>
        @font-face {
            font-family: 'SF-Pro';
            src: url('Roboto.ttf') format('truetype');
            font-weight: normal; font-style: normal; font-display: swap;
        }

        :root {
            /* 调深了背景色，确保文字能看清 */
            --glass: rgba(0, 0, 0, 0.45); 
            --glass-border: rgba(255, 255, 255, 0.15);
            --text-main: #ffffff;
        }

        * {
            margin: 0; padding: 0; box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            font-family: 'SF-Pro', -apple-system, sans-serif !important;
        }

        body {
            background: var(--page-bg) no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow: hidden;
        }

        #particles {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0; pointer-events: none;
        }

        .container {
            width: 100%;
            max-width: 420px;
            position: relative;
            z-index: 10;
        }

        /* 强化标题可见度 */
        header {
            text-align: center;
            margin-bottom: 50px;
            animation: fadeInDown 0.8s ease-out forwards;
        }

        header h1 {
            font-size: 2.6rem;
            font-weight: 900;
            letter-spacing: -1px;
            color: #fff;
            /* 多重阴影确保在亮色背景下也能看清 */
            text-shadow: 0 4px 15px rgba(0,0,0,0.6), 0 0 30px rgba(0,204,255,0.3);
            display: inline-block;
            padding: 5px 20px;
            border-radius: 100px;
        }

        /* iOS 26 纯文字卡片 */
        .grid-box {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 14px;
        }

        .card {
            background: var(--glass);
            backdrop-filter: blur(50px) saturate(200%);
            -webkit-backdrop-filter: blur(50px) saturate(200%);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 35px 10px; /* 增加高度补偿图标缺失 */
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-main);
            text-decoration: none;
            transition: all 0.3s cubic-bezier(0.2, 0, 0.2, 1);
            /* 文字阴影防止背景干扰 */
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
        }

        .card span {
            font-size: 1.05rem;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        /* 触感反馈 */
        .card:active {
            transform: scale(0.94);
            background: rgba(0, 0, 0, 0.6);
            transition: transform 0.1s;
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <canvas id="particles"></canvas>

    <div class="container">
        <header>
            <h1>LiCN · 中枢</h1>
        </header>

        <div class="grid-box">
            <div class="card" onclick="location.href='海报自定义工具.html'">
                <span>海报自定义工具</span>
            </div>

            <div class="card" onclick="location.href='LICN 名片图库.html'">
                <span>LICN 名片图库</span>
            </div>

            <div class="card" onclick="window.open('https://jcn101cvl5dk.feishu.cn/wiki/D9V4wqJgviIYXuka2KHcUXJ2nie','_blank')">
                <span>我的海报图库</span>
            </div>

            <div class="card" onclick="window.open('https://www.91m.top','_blank')">
                <span>苏苏荣耀助手</span>
            </div>
        </div>
    </div>

    <script>
        // 粒子逻辑保持极简以减少视觉干扰
        const canvas = document.getElementById('particles');
        const ctx = canvas.getContext('2d');
        let w, h, particles = [];

        function setSize() {
            w = window.innerWidth; h = window.innerHeight;
            canvas.width = w; canvas.height = h;
        }

        class Particle {
            constructor() { this.init(); }
            init() {
                this.x = Math.random() * w;
                this.y = Math.random() * h;
                this.size = Math.random() * 1.5;
                this.speedX = (Math.random() - 0.5) * 0.2;
                this.speedY = (Math.random() - 0.5) * 0.2;
                this.alpha = Math.random() * 0.3;
            }
            update() {
                this.x += this.speedX; this.y += this.speedY;
                if (this.x < 0 || this.x > w || this.y < 0 || this.y > h) this.init();
            }
            draw() {
                ctx.fillStyle = `rgba(255, 255, 255, ${this.alpha})`;
                ctx.beginPath(); ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2); ctx.fill();
            }
        }

        function setup() {
            setSize();
            for (let i = 0; i < 50; i++) particles.push(new Particle());
            window.addEventListener('resize', setSize);
            loop();
        }

        function loop() {
            ctx.clearRect(0, 0, w, h);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(loop);
        }
        setup();
    </script>

<script>document.documentElement.style.setProperty('--page-bg', 'url("删")');</script>

</body>
</html>
