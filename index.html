<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LiCN · 工作后台</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            outline: none;
            transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
        }

        :root {
            --bg-primary: #ffffff;
            --bg-secondary: #f5f5f5;
            --text-primary: #111111;
            --text-secondary: #666666;
            --card-bg: rgba(255, 255, 255, 0.95);
            --card-border: rgba(0, 0, 0, 0.1);
            --tidal-gradient: linear-gradient(-45deg, #667eea, #764ba2, #f093fb, #f5576c);
        }

        [data-theme="dark"] {
            --bg-primary: #0a0a12;
            --bg-secondary: #1a1a2e;
            --text-primary: #ffffff;
            --text-secondary: #aaaaaa;
            --card-bg: rgba(20, 20, 35, 0.85);
            --card-border: rgba(255, 255, 255, 0.1);
            --tidal-gradient: linear-gradient(-45deg, #0a0a12, #1a1a2e, #0f0f23, #16213e);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: var(--tidal-gradient);
            background-size: 400% 400%;
            animation: tidalWave 20s ease infinite;
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
            padding: 40px 20px;
            position: relative;
            overflow-x: hidden;
        }

        #particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes tidalWave {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .theme-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: none;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-primary);
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 999;
            transition: transform 0.12s ease;
        }

        .theme-toggle:active {
            transform: scale(0.9);
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        header {
            margin-bottom: 40px;
            text-align: center;
        }

        header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            animation: fadeInUp 0.8s ease forwards;
        }

        .posts {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .post-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 24px;
            cursor: pointer;
            user-select: none;
            opacity: 0;
            animation: fadeInUp 0.6s ease forwards;
            text-align: center;
            font-size: 1.1rem;
            font-weight: 500;
            position: relative;
            z-index: 2;
        }

        .post-card:nth-child(1) { animation-delay: 0.2s; }
        .post-card:nth-child(2) { animation-delay: 0.3s; }
        .post-card:nth-child(3) { animation-delay: 0.4s; }

        @keyframes popBounce {
            0%   { transform: scale(1); }
            30%  { transform: scale(0.93); }
            100% { transform: scale(1); }
        }

        .post-card.bounce {
            animation: popBounce 0.1s ease-out;
        }

        .shape {
            position: fixed;
            pointer-events: none;
            opacity: 0.15;
            z-index: 0;
            animation: shapeFloat 12s infinite ease-in-out;
        }

        @keyframes shapeFloat {
            0%,100% { transform: translate(0,0) rotate(0deg); }
            33% { transform: translate(20px,-15px) rotate(3deg); }
            66% { transform: translate(-15px,10px) rotate(-2deg); }
        }

        footer {
            display: none;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(10px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 600px) {
            body { padding: 24px 16px; }
            header h1 { font-size: 2rem; }
            .post-card { padding: 20px; }
            .theme-toggle {
                top: 12px; right: 12px;
                width: 40px; height: 40px;
                font-size: 18px;
            }
        }
    </style>
</head>

<body>
    <canvas id="particles"></canvas>
    <button class="theme-toggle" id="themeToggle">☀️</button>

    <div class="container">
        <header>
            <h1>LiCN · 工作后台</h1>
        </header>

        <div class="posts">
            <div class="post-card" onclick="bounceThis(this); goPoster()">海报工具</div>
            <div class="post-card" onclick="bounceThis(this); goPage2()">功能二</div>
            <div class="post-card" onclick="bounceThis(this); goPage3()">功能三</div>
        </div>
    </div>

    <script>
        // 粒子效果
        const canvas = document.getElementById('particles');
        const ctx = canvas.getContext('2d');
        let w = window.innerWidth, h = window.innerHeight;
        canvas.width = w; canvas.height = h;
        const particles = [];
        const count = 70;

        class Particle {
            constructor(){
                this.x = Math.random()*w;
                this.y = Math.random()*h;
                this.size = Math.random()*1.5+0.5;
                this.speedX = (Math.random()-0.5)*0.4;
                this.speedY = (Math.random()-0.5)*0.4;
                this.opacity = Math.random()*0.3+0.1;
            }
            update(){
                this.x += this.speedX;
                this.y += this.speedY;
                if(this.x<0||this.x>w) this.x = Math.random()*w;
                if(this.y<0||this.y>h) this.y = Math.random()*h;
            }
            draw(){
                ctx.fillStyle = `rgba(255,255,255,${this.opacity})`;
                ctx.beginPath();
                ctx.arc(this.x,this.y,this.size,0,Math.PI*2);
                ctx.fill();
            }
        }

        function init(){
            for(let i=0;i<count;i++) particles.push(new Particle());
        }
        function anim(){
            requestAnimationFrame(anim);
            ctx.clearRect(0,0,w,h);
            particles.forEach(p=>{p.update();p.draw()});
        }
        init(); anim();

        window.addEventListener('resize',()=>{
            w=innerWidth;h=innerHeight;
            canvas.width=w;canvas.height=h;
        });

        // 几何微动
        function createShapes(){
            const colors = ['#fff','#667eea','#764ba2'];
            for(let i=0;i<8;i++){
                let s = document.createElement('div');
                s.className = 'shape';
                s.style.width = Math.random()*30+10+'px';
                s.style.height = Math.random()*30+10+'px';
                s.style.background = colors[Math.floor(Math.random()*colors.length)];
                s.style.borderRadius = Math.random()>0.5 ? '50%' : '4px';
                s.style.left = Math.random()*100+'%';
                s.style.top = Math.random()*100+'%';
                s.style.animationDelay = Math.random()*4+'s';
                document.body.appendChild(s);
            }
        }
        createShapes();

        // 按钮弹动
        function bounceThis(el) {
            el.classList.add('bounce');
            setTimeout(()=>el.classList.remove('bounce'),100);
        }

        // —— GitHub 根目录跳转（文件都在根目录，直接写文件名）
        function goPoster() { location.href = "海报工具.html"; }
        function goPage2() { location.href = "页面2.html"; }
        function goPage3() { location.href = "页面3.html"; }

        // 主题切换
        const tg = document.getElementById('themeToggle');
        const html = document.documentElement;
        const saved = localStorage.getItem('theme')||'light';
        if(saved==='dark'){
            html.setAttribute('data-theme','dark');
            tg.textContent='🌙';
        }else{
            tg.textContent='☀️';
        }
        tg.addEventListener('click',()=>{
            if(html.getAttribute('data-theme')==='dark'){
                html.removeAttribute('data-theme');
                tg.textContent='☀️';
                localStorage.setItem('theme','light');
            }else{
                html.setAttribute('data-theme','dark');
                tg.textContent='🌙';
                localStorage.setItem('theme','dark');
            }
        });
    </script>
</body>
</html>
