<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>我的简易博客</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 800px;
      margin: 40px auto;
      padding: 0 20px;
      line-height: 1.7;
      color: #333;
      background: #fafafa;
    }
    header {
      margin-bottom: 40px;
      text-align: center;
    }
    header h1 {
      font-size: 28px;
      margin-bottom: 10px;
    }
    .article {
      background: white;
      padding: 24px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      margin-bottom: 24px;
    }
    .article h2 {
      font-size: 20px;
      margin-bottom: 10px;
    }
    .article .time {
      color: #888;
      font-size: 14px;
      margin-bottom: 14px;
    }
    footer {
      text-align: center;
      margin-top: 60px;
      color: #999;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <header>
    <h1>LiCN 的简易博客</h1>
    <p>简单干净，可直接部署到 GitHub Pages</p>
  </header>

  <div class="article">
    <h2>第一篇博客：测试文章</h2>
    <div class="time">2026-05-05</div>
    <p>这是一个极简博客模板，没有复杂依赖，直接放到 GitHub 就能运行。</p>
    <p>支持多文章、自适应手机、干净清爽，适合做个人小站 / 图传说明页。</p>
  </div>

  <div class="article">
    <h2>第二篇：域名绑定成功</h2>
    <div class="time">2026-05-05</div>
    <p>我已经成功把 licn.abrdns.com 绑定到 GitHub Pages，现在可以正常访问啦。</p>
  </div>

  <footer>
    © 2026 LiCN · 极简博客
  </footer>

</body>
</html>
