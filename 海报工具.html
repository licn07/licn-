<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LICN海报自定义工具</title>
    <style>
        @font-face {
            font-family: 'LiCN-Custom';
            src: url('Roboto.ttf') format('truetype');
            font-weight: normal; font-style: normal; font-display: swap;
        }

        :root {
            --ios-bg: #f2f2f7;
            --ios-accent: #007aff;
            --ios-green: #34c759;
            --radius-md: 14px;
        }

        * {
            margin: 0; padding: 0; box-sizing: border-box;
            -webkit-tap-highlight-color: transparent !important;
            font-family: 'LiCN-Custom', -apple-system, sans-serif !important;
            user-select: none; -webkit-user-select: none;
        }

        body { background: var(--ios-bg); padding: 15px; color: #000; }
        .container { max-width: 500px; margin: 0 auto; }
        
        /* iOS 26 风格标题 */
        .header { margin: 25px 0 25px 10px; }
        .header h1 { font-size: 30px; font-weight: 800; letter-spacing: -1px; }

        .section {
            background: #fff; border-radius: var(--radius-md);
            padding: 18px; margin-bottom: 16px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.03);
        }

        .section h2 { font-size: 17px; font-weight: 600; margin-bottom: 15px; display: flex; align-items: center; justify-content: space-between; }

        /* --- 核心修复：物理遮罩区域 --- */
        .stamp-wrap {
            overflow: hidden;
            /* 关键：19vw 是 5列布局下精准的一排高度，确保第二排绝对露不出来 */
            height: 19vw; 
            max-height: 95px; /* 大屏适配 */
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .stamp-wrap.expand {
            height: auto;
            max-height: 500px; /* 展开后的上限 */
        }

        .stamp-list {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            padding: 2px;
        }

        .stamp-item {
            width: 100%; aspect-ratio: 1;
            border: 1px solid #efeff4; border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            background: #fbfbfd; transition: 0.2s;
        }
        .stamp-item img { max-width: 85%; max-height: 85%; object-fit: contain; }
        .stamp-item.selected { border-color: var(--ios-accent); background: #f2f8ff; box-shadow: 0 0 0 1.5px var(--ios-accent); }

        .expand-btn {
            width: 100%; padding: 12px; margin-top: 15px;
            background: #f2f2f7; border: none; border-radius: 12px;
            color: var(--ios-accent); font-size: 14px; font-weight: 600;
        }

        /* --- 功能区域 --- */
        .preview-area { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
        .preview-item { width: 55px; height: 55px; border-radius: 8px; overflow: hidden; background: #f2f2f7; border: 0.5px solid #d1d1d6; }
        .preview-item img { width: 100%; height: 100%; object-fit: cover; }

        .upload-btn {
            width: 100%; padding: 18px; border: 1.5px dashed #c7c7cc; border-radius: 14px;
            color: var(--ios-accent); font-size: 16px; margin: 15px 0;
            background: transparent; font-weight: 500;
        }

        .btn-group { display: flex; gap: 12px; }
        .process-btn, .download-btn { flex: 1; padding: 16px; border: none; border-radius: 14px; font-size: 17px; font-weight: 600; }
        .process-btn { background: var(--ios-accent); color: #fff; }
        .download-btn { background: var(--ios-green); color: #fff; display: none; }
        
        .result-box { width: 65%; margin: 15px auto; aspect-ratio: 450/700; border-radius: 12px; overflow: hidden; position: relative; background: #e5e5ea; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .result-img { width: 100%; height: 100%; object-fit: contain; }
        .frame-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }

        #useStamp { width: 22px; height: 22px; accent-color: var(--ios-accent); }
    </style>
</head>
<body oncontextmenu="return false;">

<div class="container">
    <div class="header"><h1>LICN海报自定义工具</h1></div>
    
    <div class="section">
        <h2>选择限定标 <label style="display:flex;align-items:center;gap:6px"><input type="checkbox" id="useStamp"><span style="font-size:14px;color:#8e8e93;font-weight:normal">开启</span></label></h2>
        <div class="stamp-wrap" id="stampWrap">
            <div class="stamp-list" id="stampList"></div>
        </div>
        <button class="expand-btn" id="expandBtn">展开全部限定标</button>
    </div>

    <div class="section">
        <div class="preview-area" id="previewArea"></div>
        <button class="upload-btn" id="uploadBtn">点击上传图片</button>
        <div class="btn-group">
            <button class="process-btn" id="processBtn">开始处理</button>
            <button class="download-btn" id="downloadBtn">下载图片</button>
        </div>
        <div id="resultContainer"></div>
    </div>
</div>

<script>
    let selectedStampNum = null;
    let uploadedFiles = [];
    let allBlobs = [];
    let frameFile = "边框.png";

    // 1. 初始化列表：坚持读取 限定1.png
    const stampList = document.getElementById('stampList');
    for(let i=1; i<=10; i++){
        let item = document.createElement('div');
        item.className = 'stamp-item';
        item.innerHTML = `<img src="限定${i}.png?${Math.random()}">`;
        stampList.appendChild(item);
        item.onclick = ()=>{
            document.getElementById('useStamp').checked = true;
            document.querySelectorAll('.stamp-item').forEach(s=>s.classList.remove('selected'));
            item.classList.add('selected');
            selectedStampNum = i;
        };
    }

    // 2. 展开收起逻辑
    const stampWrap = document.getElementById('stampWrap');
    const expandBtn = document.getElementById('expandBtn');
    expandBtn.onclick = () => {
        const isExpand = stampWrap.classList.toggle('expand');
        expandBtn.innerText = isExpand ? '收起限定标' : '展开全部限定标';
    };

    // 3. 文件上传逻辑
    const uploadBtn = document.getElementById('uploadBtn');
    const fileInput = document.createElement('input');
    fileInput.type = 'file'; fileInput.multiple = true; fileInput.accept = 'image/*';
    uploadBtn.onclick = () => fileInput.click();
    fileInput.onchange = (e) => {
        uploadedFiles = Array.from(e.target.files);
        const preview = document.getElementById('previewArea');
        preview.innerHTML = '';
        uploadedFiles.forEach(f => {
            const reader = new FileReader();
            reader.onload = (ev) => {
                preview.innerHTML += `<div class="preview-item"><img src="${ev.target.result}"></div>`;
            };
            reader.readAsDataURL(f);
        });
    };

    // 4. 海报合成逻辑
    document.getElementById('processBtn').onclick = async function() {
        if(uploadedFiles.length === 0) return;
        this.innerText = "处理中...";
        const container = document.getElementById('resultContainer');
        container.innerHTML = '<div style="text-align:center;color:#007aff;font-size:12px;margin:10px 0;">预览带方框，下载为原图</div>';
        allBlobs = [];
        
        // 自动检测边框文件
        frameFile = await new Promise(res => {
            const img = new Image();
            img.onload = () => res("边框.png");
            img.onerror = () => res("方框.png");
            img.src = "边框.png";
        });

        for(let file of uploadedFiles) {
            const blob = await processImg(file);
            allBlobs.push(blob);
            const url = URL.createObjectURL(blob);
            const box = document.createElement('div');
            box.className = 'result-box';
            box.innerHTML = `<img class="result-img" src="${url}"><img class="frame-overlay" src="${frameFile}?${Math.random()}">`;
            container.appendChild(box);
        }
        this.innerText = "处理完成";
        document.getElementById('downloadBtn').style.display = "block";
    };

    async function processImg(file) {
        return new Promise(resolve => {
            const img = new Image();
            img.src = URL.createObjectURL(file);
            img.onload = async () => {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                canvas.width = 450; canvas.height = 700;
                const scale = Math.max(canvas.width/img.width, canvas.height/img.height);
                const w = img.width * scale, h = img.height * scale;
                ctx.drawImage(img, (canvas.width-w)/2, (canvas.height-h)/2, w, h);

                if(document.getElementById('useStamp').checked && selectedStampNum) {
                    const stamp = new Image();
                    stamp.src = `限定${selectedStampNum}.png`; 
                    await new Promise(r => { stamp.onload = r; });
                    const sw = canvas.width * 0.85;
                    const sh = (stamp.height/stamp.width) * sw;
                    ctx.drawImage(stamp, (canvas.width-sw)/2, (canvas.height-sh)/2 + 50, sw, sh);
                }
                canvas.toBlob(resolve, 'image/png');
            };
        });
    }

    // 5. 批量下载
    document.getElementById('downloadBtn').onclick = () => {
        allBlobs.forEach((blob, i) => {
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `Poster_${i+1}.png`;
            a.click();
        });
    };
</script>
</body>
</html>
