<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LICN名片图库</title>
    <style>
        :root {
            --ios-bg: #f2f2f7;
            --radius-md: 14px;
            --radius-lg: 20px;
            --ios-accent: #007aff;
            --ios-red: #ff3b30; /* iOS 标准警示红 */
        }

        /* 全局彻底消除点击高亮与系统菜单 */
        * { 
            box-sizing: border-box; 
            -webkit-tap-highlight-color: transparent !important; 
            outline: none !important;
            user-select: none; 
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, sans-serif; 
            background: var(--ios-bg); 
            margin: 0; padding: 15px; 
            display: flex; flex-direction: column; align-items: center; 
            min-height: 100vh;
        }

        .app-container { width: 100%; max-width: 440px; }
        header { margin-bottom: 20px; padding-left: 5px; }
        h1 { font-size: 28px; font-weight: 800; margin: 0; letter-spacing: -1px; }
        .subtitle { font-size: 13px; color: #8e8e93; margin-top: 4px; }
        
        #gallery { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; }
        
        .card { 
            position: relative; background: #e5e5ea; border-radius: var(--radius-md); 
            overflow: hidden; aspect-ratio: 4/3; box-shadow: 0 2px 8px rgba(0,0,0,0.04); cursor: pointer;
        }
        
        .card img { width: 100%; height: 100%; object-fit: cover; display: none; pointer-events: none; }
        .img-guard { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 5; background: transparent; }
        
        .name-overlay { 
            position: absolute; top: 8px; left: 8px; color: #34c759; font-weight: 900; 
            font-size: 18px; text-shadow: 0px 1px 3px rgba(0,0,0,0.4); z-index: 10;
        }
        
        .card::after { content: "无图"; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #aeaeae; font-size: 11px; z-index: 1; }
        .card.has-img::after { display: none; }

        /* 弹窗公告动画 */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.3); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            display: flex; align-items: center; justify-content: center; z-index: 999;
            transition: opacity 0.5s ease;
        }
        
        .modal-content {
            width: 280px; background: rgba(255, 255, 255, 0.9);
            border-radius: var(--radius-lg); overflow: hidden;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            animation: modalFlyIn 0.6s cubic-bezier(0.23, 1, 0.32, 1);
            transition: transform 0.4s ease, opacity 0.4s ease;
        }

        @keyframes modalFlyIn {
            from { transform: translateY(100px) scale(0.9); opacity: 0; }
            to { transform: translateY(0) scale(1); opacity: 1; }
        }

        .modal-fade-out {
            transform: scale(0.85) !important;
            opacity: 0 !important;
        }

        .modal-body { padding: 20px; text-align: center; }
        .modal-title { font-size: 17px; font-weight: 600; margin-bottom: 8px; }
        .modal-text { font-size: 13px; color: #333; line-height: 1.6; }
        .modal-alert-red { color: var(--ios-red); font-weight: 600; margin-top: 6px; display: block; } /* 红色重点文案 */

        .modal-btn {
            width: 100%; padding: 12px; border: none; background: transparent;
            border-top: 0.5px solid rgba(0,0,0,0.1); color: var(--ios-accent);
            font-size: 17px; font-weight: 600; cursor: pointer;
        }
        .modal-btn:active { opacity: 0.5; background: transparent !important; }

        /* 大图查看器 */
        .viewer-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            z-index: 1000; display: none; flex-direction: column; align-items: center; justify-content: center;
            opacity: 0; transition: opacity 0.3s ease;
        }
        .viewer-img { max-width: 90%; max-height: 70%; border-radius: 12px; pointer-events: none; }
        
        .viewer-close-btn {
            margin-top: 30px; width: 60px; height: 60px; background: rgba(255,255,255,0.15);
            border: 1px solid rgba(255,255,255,0.3); border-radius: 50%;
            display: flex; align-items: center; justify-content: center; cursor: pointer;
            position: relative;
        }
        .viewer-close-btn::before, .viewer-close-btn::after { content: ''; position: absolute; width: 24px; height: 2px; background: white; }
        .viewer-close-btn::before { transform: rotate(45deg); }
        .viewer-close-btn::after { transform: rotate(-45deg); }

        #sentinel { height: 80px; width: 100%; display: flex; align-items: center; justify-content: center; color: #8e8e93; font-size: 12px; }
    </style>
</head>
<body oncontextmenu="return false;" ondragstart="return false;">

<div class="modal-overlay" id="modalOverlay">
    <div class="modal-content" id="modalContent">
        <div class="modal-body">
            <div class="modal-title">欢迎访问LICN名片图库</div>
            <div class="modal-text">
                首次加载可能有点慢<br>请耐心等待图片加载吧
                <span class="modal-alert-red">图片看着模糊是为了流畅加载，我这边是改原图的放心</span>
            </div>
        </div>
        <button class="modal-btn" onclick="closeModal()">好</button>
    </div>
</div>

<div class="viewer-overlay" id="viewerOverlay" onclick="closeViewer()">
    <img src="" class="viewer-img" id="viewerImg" onclick="event.stopPropagation()">
    <div class="viewer-close-btn" onclick="closeViewer()"></div>
</div>

<div class="app-container">
    <header>
        <h1>LICN名片图库</h1>
        <div class="subtitle">仿iOS 26UI</div>
    </header>

    <div id="gallery"></div>
    <div id="sentinel">正在加载索引...</div>
</div>

<script>
    // 离线缓存 Service Worker 注册
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js');
        });
    }

    const gallery = document.getElementById('gallery');
    const sentinel = document.getElementById('sentinel');
    const modalOverlay = document.getElementById('modalOverlay');
    const modalContent = document.getElementById('modalContent');
    const viewer = document.getElementById('viewerOverlay');
    const viewerImg = document.getElementById('viewerImg');
    
    let currentIndex = 1;
    const PAGE_SIZE = 40; 
    const MAX_INDEX = 9999;

    function closeModal() {
        modalContent.classList.add('modal-fade-out');
        modalOverlay.style.opacity = '0';
        setTimeout(() => {
            modalOverlay.style.display = 'none';
        }, 450);
    }

    function openViewer(src) {
        viewerImg.src = src;
        viewer.style.display = 'flex';
        setTimeout(() => viewer.style.opacity = '1', 10);
    }

    function closeViewer() {
        viewer.style.opacity = '0';
        setTimeout(() => {
            viewer.style.display = 'none';
            viewerImg.src = "";
        }, 300);
    }

    function createCard(i) {
        const card = document.createElement('div');
        card.className = 'card';
        card.id = `card-${i}`;
        card.innerHTML = `
            <div class="img-guard"></div>
            <div class="name-overlay">${i}</div>
            <img src="${i}.jpg" onload="showImg(${i})">
        `;
        card.onclick = () => {
            if(card.classList.contains('has-img')) {
                openViewer(`${i}.jpg`);
            }
        };
        return card;
    }

    function showImg(i) {
        const card = document.getElementById(`card-${i}`);
        if(card) {
            const img = card.querySelector('img');
            card.classList.add('has-img');
            img.style.display = 'block';
        }
    }

    function loadMore() {
        if (currentIndex > MAX_INDEX) {
            sentinel.innerText = "已加载全部 9999 个索引";
            return;
        }
        const fragment = document.createDocumentFragment();
        for (let i = 0; i < PAGE_SIZE && currentIndex <= MAX_INDEX; i++) {
            fragment.appendChild(createCard(currentIndex));
            currentIndex++;
        }
        gallery.appendChild(fragment);
    }

    const observer = new IntersectionObserver((entries) => {
        if (entries[0].isIntersecting) {
            loadMore();
        }
    }, { threshold: 0.1 });

    observer.observe(sentinel);
</script>
</body>
</html>
