<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LiCN · 海报自定义</title>
    <style>
        :root {
            --ios-bg: #F8F9FB;
            --grid-line: #E5EEF9;
            --ios-accent: #007aff;
            --ios-green: #34c759;
            --glass-bg: rgba(255, 255, 255, 0.75);
            --glass-border: rgba(255, 255, 255, 0.8);
            --btn-bg: #ffffff;
            --text-main: #1d1d1f;
            --text-sub: #8e8e93;
            --radius-md: 24px;
            --smooth-curve: cubic-bezier(0.25, 0.1, 0.25, 1);
        }

        .dark-mode {
            --ios-bg: #050505;
            --grid-line: #1a1a1a;
            --ios-accent: #00CCFF;
            --glass-bg: rgba(28, 28, 30, 0.8);
            --glass-border: rgba(255, 255, 255, 0.1);
            --btn-bg: #1c1c1e;
            --text-main: #ffffff;
            --text-sub: rgba(255, 255, 255, 0.5);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body { 
            background-color: var(--ios-bg);
            background-image: linear-gradient(var(--grid-line) 1px, transparent 1px), linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
            background-size: 25px 25px; font-family: -apple-system, sans-serif;
            color: var(--text-main); height: 100vh; overflow: hidden; display: flex; flex-direction: column;
            transition: background 0.3s ease;
        }

        .header {
            padding: 15px 20px; 
            background: transparent;
            display: flex; 
            align-items: center; 
            justify-content: space-between; 
            z-index: 100;
        }
        
        .header-btn { 
            width: 42px; 
            height: 42px; 
            border-radius: 14px; 
            background: var(--btn-bg); 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            cursor: pointer; 
            color: var(--text-main);
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            transition: transform 0.1s ease, background 0.3s ease;
            border: 1px solid var(--glass-border);
        }
        .header-btn:active { transform: scale(0.92); }
        .header-btn svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

        .sun-icon { display: none; filter: drop-shadow(0 0 5px orange); }
        .dark-mode .moon-icon { display: none; }
        .dark-mode .sun-icon { display: block; }

        .header-title { font-size: 20px; font-weight: 800; letter-spacing: -0.5px; }

        .main-scroll { flex: 1; overflow-y: auto; padding: 15px; -webkit-overflow-scrolling: touch; }
        .scroll-content { max-width: 420px; margin: 0 auto; padding-bottom: 250px; }

        .control-block {
            background: transparent; 
            border-radius: var(--radius-md); 
            border: 1px solid var(--glass-border);
            transition: all 0.4s var(--smooth-curve); 
            overflow: hidden;
        }
        
        .control-group { margin-bottom: 15px; }
        .capsule-row { padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; }
        
        .click-area { cursor: pointer; flex: 1; } 
        .label-text { font-weight: 700; font-size: 18px; }
        .sub-text { font-size: 11px; color: var(--text-sub); margin-top: 2px; }

        .stamp-container { height: 0; opacity: 0; transition: all 0.4s var(--smooth-curve); padding: 0 15px; visibility: hidden; }
        .control-group.expanded .stamp-container { height: 170px; opacity: 1; padding-bottom: 15px; visibility: visible; }
        .stamp-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
        .stamp-box { aspect-ratio: 1; border-radius: 12px; border: 1px solid var(--glass-border); background: rgba(120,120,120,0.05); display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .stamp-box.selected { border: 2.5px solid var(--ios-accent); background: rgba(255, 255, 255, 0.2); }
        .stamp-box img { max-width: 80%; }

        .switch-wrapper { padding: 10px; cursor: pointer; margin-right: -10px; }
        .switch { position: relative; width: 44px; height: 24px; pointer-events: none; display: inline-block; }
        .switch.interactive { pointer-events: auto; }
        
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background-color: #d1d1d6; transition: .3s; border-radius: 30px; }
        .slider:before { position: absolute; content: ""; height: 20px; width: 20px; left: 2px; bottom: 2px; background-color: white; transition: .3s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--ios-green); }
        input:checked + .slider:before { transform: translateX(20px); }

        .settings-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); display: none; z-index: 2000; backdrop-filter: blur(8px); }
        .modal-content { position: absolute; bottom: 35px; left: 15px; right: 15px; background: var(--glass-bg); border-radius: 28px; padding: 22px; border: 1px solid var(--glass-border); animation: slideUp 0.3s var(--smooth-curve); }
        .size-option { display: flex; align-items: center; justify-content: space-between; padding: 18px; border-bottom: 0.5px solid rgba(120,120,120,0.1); font-weight: 700; color: var(--text-main); cursor: pointer; }
        .size-option.active { color: var(--ios-accent); background: rgba(0,122,255,0.05); border-radius: 12px; }

        .footer-bar { position: fixed; bottom: 15px; left: 0; right: 0; padding: 0 20px; z-index: 100; pointer-events: none; }
        .footer-content { max-width: 420px; margin: 0 auto; display: flex; flex-direction: column; gap: 15px; pointer-events: auto; }
        
        .action-block { background: transparent; border-radius: var(--radius-md); text-align: center; justify-content: center; cursor: pointer; transition: all 0.2s ease; }
        .action-block:active { transform: scale(0.98); background: rgba(120,120,120,0.1); }
        .action-text { width: 100%; padding: 8px 20px; font-weight: 800; font-size: 17px; }

        #uploadBtn { border: 2px dashed var(--ios-accent); }
        #uploadBtn .action-text { color: var(--ios-accent); }
        #downloadBtn { display: none; border: 2px solid var(--ios-green); }
        #downloadBtn .action-text { color: var(--ios-green); }

        #resultContainer { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-top: 20px; }
        .result-card { background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 16px; padding: 8px; animation: fadeIn 0.4s ease; text-align: center; }
        .poster-box { width: 100%; border-radius: 10px; overflow: hidden; background: #333; position: relative; }
        .real-img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .border-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; object-fit: fill; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes slideUp { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    </style>
</head>
<body>

<header class="header">
    <div class="header-btn" id="openSettings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M12 15a3 3 0 100-6 3 3 0 000 6z"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
    </div>
    <h1 class="header-title">海报自定义</h1>
    <div class="header-btn" onclick="toggleTheme()">
        <svg class="moon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
        <svg class="sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
    </div>
</header>

<main class="main-scroll">
    <div class="scroll-content">
        <div class="control-block control-group" id="mainControl">
            <div class="capsule-row">
                <div class="click-area" id="titleBtn">
                    <p class="label-text">使用限定标</p>
                    <p class="sub-text">叠加在海报中心偏下位置</p>
                </div>
                <div class="switch-wrapper" id="switchBtn">
                    <label class="switch">
                        <input type="checkbox" id="useStamp">
                        <span class="slider"></span>
                    </label>
                </div>
            </div>
            <div class="stamp-container">
                <div class="stamp-grid" id="stampGrid"></div>
            </div>
        </div>
        <div id="resultContainer"></div>
    </div>
</main>

<div class="settings-overlay" id="settingsOverlay">
    <div class="modal-content">
        <h3 style="margin-bottom:15px; font-size:16px; text-align:center; color:var(--text-sub);">输出尺寸</h3>
        <div class="size-option" data-w="450" data-h="700"><span>标准</span><span>450 x 700</span></div>
        <div class="size-option" data-w="180" data-h="280"><span>迷你</span><span>180 x 280</span></div>
        <div class="size-option" data-w="900" data-h="1400"><span>超高清</span><span>900 x 1400</span></div>
        
        <div style="margin-top:15px; border-top: 1px solid rgba(120,120,120,0.1);">
            <div style="display:flex; align-items:center; justify-content:space-between; padding:15px 5px;">
                <span style="font-weight:700; user-select:none; -webkit-user-select:none;">有损压缩 (JPG)</span>
                <div class="switch-wrapper"><label class="switch interactive"><input type="checkbox" id="lossyJpg" onchange="updateCompression('lossy')"><span class="slider"></span></label></div>
            </div>
            <div style="display:flex; align-items:center; justify-content:space-between; padding:15px 5px;">
                <span style="font-weight:700; user-select:none; -webkit-user-select:none;">无损压缩 (PNG)</span>
                <div class="switch-wrapper"><label class="switch interactive"><input type="checkbox" id="losslessPng" onchange="updateCompression('lossless')"><span class="slider"></span></label></div>
            </div>
        </div>

        <button id="closeBtn" style="width:100%; padding:16px; background:rgba(120,120,120,0.1); border:none; border-radius:16px; margin-top:15px; font-weight:800; color:var(--ios-accent); cursor:pointer;">完成</button>
    </div>
</div>

<footer class="footer-bar">
    <div class="footer-content">
        <div class="action-block" id="uploadBtn">
            <div class="action-text">选择图片开始处理</div>
        </div>
        <div class="action-block" id="downloadBtn">
            <div class="action-text">保存海报</div>
        </div>
    </div>
</footer>

<script>
    function applyTheme(theme) { document.body.classList.toggle('dark-mode', theme === 'dark'); }
    function toggleTheme() {
        const isDark = document.body.classList.toggle('dark-mode');
        localStorage.setItem('licn-theme', isDark ? 'dark' : 'light');
        if (window.navigator.vibrate) window.navigator.vibrate(5);
    }
    if (localStorage.getItem('licn-theme')) applyTheme(localStorage.getItem('licn-theme'));

    let currentW = localStorage.getItem('posterW') || 450, currentH = localStorage.getItem('posterH') || 700;
    let selectedStamp = null, uploadedFiles = [], processedFiles = [];

    function updateCompression(type) {
        if (type === 'lossy') {
            if (document.getElementById('lossyJpg').checked) document.getElementById('losslessPng').checked = false;
        } else {
            if (document.getElementById('losslessPng').checked) document.getElementById('lossyJpg').checked = false;
        }
    }

    const overlay = document.getElementById('settingsOverlay');
    document.getElementById('openSettings').onclick = () => overlay.style.display = 'block';
    document.getElementById('closeBtn').onclick = () => { overlay.style.display = 'none'; if(uploadedFiles.length > 0) processImages(); };

    document.querySelectorAll('.size-option').forEach(opt => {
        if(opt.dataset.w == currentW) opt.classList.add('active');
        opt.onclick = () => {
            document.querySelectorAll('.size-option').forEach(o => o.classList.remove('active'));
            opt.classList.add('active');
            currentW = opt.dataset.w; currentH = opt.dataset.h;
            localStorage.setItem('posterW', currentW); localStorage.setItem('posterH', currentH);
            if (window.navigator.vibrate) window.navigator.vibrate(5);
        };
    });

    const grid = document.getElementById('stampGrid');
    for(let i=1; i<=10; i++) {
        const box = document.createElement('div');
        box.className = 'stamp-box';
        box.innerHTML = `<img src="限定${i}.png" onerror="this.style.opacity='0'">`;
        box.onclick = (e) => {
            e.stopPropagation();
            document.querySelectorAll('.stamp-box').forEach(b => b.classList.remove('selected'));
            box.classList.add('selected');
            selectedStamp = i;
            document.getElementById('useStamp').checked = true;
            document.getElementById('mainControl').classList.remove('expanded');
            if (window.navigator.vibrate) window.navigator.vibrate(5);
            if(uploadedFiles.length > 0) processImages();
        };
        grid.appendChild(box);
    }

    document.getElementById('titleBtn').onclick = () => {
        const control = document.getElementById('mainControl');
        control.classList.toggle('expanded');
        if (window.navigator.vibrate) window.navigator.vibrate(5);
    };

    document.getElementById('switchBtn').onclick = (e) => {
        const checkbox = document.getElementById('useStamp');
        const control = document.getElementById('mainControl');
        checkbox.checked = !checkbox.checked;
        control.classList.add('expanded');
        if (window.navigator.vibrate) window.navigator.vibrate(5);
        if(uploadedFiles.length > 0) processImages();
    };

    const fileInput = document.createElement('input');
    fileInput.type = 'file'; fileInput.multiple = true;
    document.getElementById('uploadBtn').onclick = () => fileInput.click();
    fileInput.onchange = (e) => { uploadedFiles = Array.from(e.target.files); processImages(); };

    async function processImages() {
        const container = document.getElementById('resultContainer');
        const dlBtn = document.getElementById('downloadBtn');
        container.innerHTML = ''; processedFiles = [];
        const useStamp = document.getElementById('useStamp').checked;
        for(let i=0; i<uploadedFiles.length; i++) {
            const file = uploadedFiles[i];
            const blob = await processSingle(file, useStamp);
            const url = URL.createObjectURL(blob);
            const sizeKB = (blob.size / 1024).toFixed(0);
            const sizeMB = (blob.size / 1024 / 1024).toFixed(2);
            const sizeText = (blob.size < 1024 * 1024) ? `${sizeKB} KB` : `${sizeMB} MB`;
            
            const originalName = file.name.split('.').slice(0, -1).join('.');
            processedFiles.push({ url, originalName });
            
            const card = document.createElement('div');
            card.className = 'result-card';
            card.innerHTML = `<div class="poster-box" style="aspect-ratio:${currentW}/${currentH}"><img src="${url}" class="real-img"><img src="边框.png" class="border-overlay" onerror="this.style.opacity='0'"></div><p style="font-size:10px; margin-top:5px; color:var(--text-sub);">已生成 · ${sizeText}</p>`;
            container.appendChild(card);
        }
        dlBtn.style.display = 'block';
    }

    async function processSingle(file, useStamp) {
        return new Promise(resolve => {
            const img = new Image(); img.src = URL.createObjectURL(file);
            img.onload = async () => {
                const canvas = document.createElement('canvas'); const ctx = canvas.getContext('2d');
                canvas.width = currentW; canvas.height = currentH;
                
                const isLossy = document.getElementById('lossyJpg').checked;
                const isLossless = document.getElementById('losslessPng').checked;

                if(isLossy) {
                    ctx.fillStyle = "#FFFFFF";
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                }

                const scale = Math.max(canvas.width/img.width, canvas.height/img.height);
                const w = img.width * scale, h = img.height * scale;
                ctx.drawImage(img, (canvas.width-w)/2, (canvas.height-h)/2, w, h);
                
                if(useStamp && selectedStamp) {
                    const sImg = new Image(); sImg.src = `限定${selectedStamp}.png`;
                    await new Promise(r => { sImg.onload = r; sImg.onerror = r; });
                    const sw = canvas.width; const sh = (sImg.height / sImg.width) * sw;
                    ctx.drawImage(sImg, 0, (canvas.height - sh) / 2 + (sh / 2), sw, sh);
                }
                URL.revokeObjectURL(img.src);
                
                if(isLossy) {
                    canvas.toBlob(resolve, 'image/jpeg', 0.85);
                } else {
                    canvas.toBlob(resolve, 'image/png');
                }
            };
        });
    }

    // 修复下载逻辑：不再使用延时循环，改为在用户直接点击时触发单次遍历下载
    document.getElementById('downloadBtn').onclick = () => {
        const isLossy = document.getElementById('lossyJpg').checked;
        const isLossless = document.getElementById('losslessPng').checked;
        const needsSuffix = isLossy || isLossless;
        const ext = isLossy ? '.jpg' : '.png';
        const suffix = needsSuffix ? '压缩' : '';
        
        processedFiles.forEach(f => { 
            const a = document.createElement('a'); 
            a.href = f.url; 
            a.download = f.originalName + suffix + ext; 
            a.click(); 
        });
    };
</script>
</body>
</html>
