<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LiCN · 海报自定义</title>
    <style>
        @font-face {
            font-family: 'LiCN-Custom';
            src: url('Roboto.ttf') format('truetype');
            font-weight: normal; font-style: normal; font-display: swap;
        }

        :root {
            --ios-bg: #f2f2f7;
            --ios-accent: #007aff;
            --ios-green: #34c759;
            --radius-md: 14px;
            --radius-sm: 10px;
        }

        * {
            margin: 0; padding: 0; box-sizing: border-box;
            -webkit-tap-highlight-color: transparent !important;
            font-family: 'LiCN-Custom', -apple-system, sans-serif !important;
        }

        body { background: var(--ios-bg); padding: 8px; color: #000; min-height: 100vh; }
        .container { max-width: 420px; margin: 0 auto; position: relative; }
        
        .header-wrap { display: flex; align-items: center; justify-content: space-between; margin: 5px 4px 10px; }
        .header-wrap h1 { font-size: 20px; font-weight: 800; letter-spacing: -0.5px; }
        .settings-btn { 
            width: 32px; height: 32px; background: #fff; border-radius: 50%; 
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 1px 5px rgba(0,0,0,0.05); cursor: pointer;
        }

        .section { background: #fff; border-radius: var(--radius-md); padding: 10px; margin-bottom: 8px; box-shadow: 0 1px 6px rgba(0,0,0,0.02); }
        .section h2 { font-size: 13px; font-weight: 600; margin-bottom: 8px; display: flex; align-items: center; justify-content: space-between; }

        .switch { position: relative; display: inline-block; width: 40px; height: 22px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #e9e9eb; transition: .3s; border-radius: 30px; }
        .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 2px; bottom: 2px; background-color: white; transition: .3s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--ios-green); }
        input:checked + .slider:before { transform: translateX(18px); }

        .stamp-wrap { overflow: hidden; height: 17vw; max-height: 70px; transition: all 0.4s ease; }
        .stamp-wrap.expand { height: auto; max-height: 500px; }
        .stamp-list { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
        .stamp-item { width: 100%; aspect-ratio: 1; border: 1px solid #f2f2f7; border-radius: 8px; display: flex; align-items: center; justify-content: center; background: #fbfbfd; }
        .stamp-item img { max-width: 80%; max-height: 80%; object-fit: contain; }
        .stamp-item.selected { border-color: var(--ios-accent); background: #f2f8ff; box-shadow: 0 0 0 1px var(--ios-accent); }

        .expand-btn { width: 100%; padding: 6px; margin-top: 8px; background: #f2f2f7; border: none; border-radius: 6px; color: var(--ios-accent); font-size: 10px; font-weight: 700; }

        .preview-area { display: flex; flex-wrap: wrap; gap: 4px; overflow: hidden; height: 48px; }
        .preview-item { width: 48px; height: 48px; border-radius: 6px; overflow: hidden; background: #eee; border: 0.5px solid #ddd; }
        .preview-item img { width: 100%; height: 100%; object-fit: cover; }
        
        .upload-btn { width: 100%; padding: 10px; border: 1.2px dashed #d1d1d6; border-radius: var(--radius-sm); color: var(--ios-accent); font-size: 13px; background: #fbfbfd; font-weight: 600; margin-top: 8px; }
        .status-bar { width: 100%; padding: 10px; border-radius: var(--radius-sm); font-size: 14px; font-weight: 700; text-align: center; background: #e5e5ea; color: #8e8e93; display: none; margin-top: 8px; }
        .status-bar.active { background: var(--ios-accent); color: #fff; display: block; }
        .status-bar.done { background: var(--ios-green); }

        .download-btn { width: 100%; padding: 12px; border: none; border-radius: var(--radius-sm); background: var(--ios-green); color: #fff; font-weight: 600; display: none; margin-top: 8px; font-size: 14px; box-shadow: 0 4px 12px rgba(52, 199, 89, 0.2); }

        #resultContainer { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 10px; }
        .result-card { background: #fff; border-radius: 10px; padding: 6px; box-shadow: 0 1px 6px rgba(0,0,0,0.03); }
        .poster-box { width: 100%; aspect-ratio: 450/700; border-radius: 4px; overflow: hidden; position: relative; background: #e5e5ea; }
        .result-img { width: 100%; height: 100%; object-fit: cover; }
        .frame-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        .info-time { color: #8e8e93; font-size: 8px; margin-top: 4px; text-align: center; }

        .settings-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.3); display: none; z-index: 1000; backdrop-filter: blur(4px); }
        .modal-content { position: absolute; bottom: 20px; left: 8px; right: 8px; background: #fff; border-radius: 20px; padding: 15px; animation: slideUp 0.2s ease-out; }
        .size-option { display: flex; align-items: center; justify-content: space-between; padding: 14px; border-bottom: 0.5px solid #f2f2f7; font-weight: 600; font-size: 14px; }
        .size-option.active { color: var(--ios-accent); }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    </style>
</head>
<body oncontextmenu="return false;">

<div class="container">
    <div class="header-wrap">
        <h1>海报自定义</h1>
        <div class="settings-btn" id="openSettings">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
        </div>
    </div>
    
    <div class="section">
        <h2>使用限定标 <label class="switch"><input type="checkbox" id="useStamp"><span class="slider"></span></label></h2>
        <div class="stamp-wrap" id="stampWrap"><div class="stamp-list" id="stampList"></div></div>
        <button class="expand-btn" id="expandBtn">展开 ▾</button>
    </div>

    <div class="section">
        <div class="preview-area" id="previewArea"></div>
        <button class="upload-btn" id="uploadBtn">选择图片</button>
        <div id="statusBar" class="status-bar">正在处理...</div>
        <button class="download-btn" id="downloadBtn">立即下载图片</button>
    </div>

    <div id="resultContainer"></div>
</div>

<div class="settings-overlay" id="settingsOverlay">
    <div class="modal-content">
        <h3 style="margin-bottom:12px; font-size:15px; text-align:center; color:#8e8e93;">输出尺寸</h3>
        <div class="size-option" data-w="450" data-h="700"><span>标准</span><span>450x700</span></div>
        <div class="size-option" data-w="180" data-h="280"><span>迷你</span><span>180x280</span></div>
        <div class="size-option" data-w="900" data-h="1400"><span>超高清</span><span>900x1400</span></div>
        <button id="closeBtn" style="width:100%; padding:12px; background:var(--ios-bg); border:none; border-radius:12px; margin-top:12px; font-weight:700; color:var(--ios-accent);">完成</button>
    </div>
</div>

<script>
    let currentW = localStorage.getItem('posterW') || 450;
    let currentH = localStorage.getItem('posterH') || 700;
    let selectedStampNum = null;
    let uploadedFiles = [];
    let allBlobs = [];
    let activeObjectURLs = []; // 用于追踪并清理 ObjectURL
    let frameFile = "边框.png";

    // 清理缓存函数
    function clearImageCache() {
        activeObjectURLs.forEach(url => URL.revokeObjectURL(url));
        activeObjectURLs = [];
        allBlobs = [];
    }

    const overlay = document.getElementById('settingsOverlay');
    document.getElementById('openSettings').onclick = () => overlay.style.display = 'block';
    overlay.onclick = (e) => { if (e.target === overlay) overlay.style.display = 'none'; };
    document.getElementById('closeBtn').onclick = () => overlay.style.display = 'none';

    document.querySelectorAll('.size-option').forEach(opt => {
        if(opt.dataset.w == currentW) opt.classList.add('active');
        opt.onclick = async () => {
            document.querySelectorAll('.size-option').forEach(o => o.classList.remove('active'));
            opt.classList.add('active');
            currentW = opt.dataset.w; currentH = opt.dataset.h;
            localStorage.setItem('posterW', currentW); localStorage.setItem('posterH', currentH);
            if(uploadedFiles.length > 0) await autoProcess();
        };
    });

    const stampList = document.getElementById('stampList');
    const stampCheck = document.getElementById('useStamp');
    for(let i=1; i<=10; i++){
        let item = document.createElement('div');
        item.className = 'stamp-item';
        item.innerHTML = `<img src="限定${i}.png">`;
        stampList.appendChild(item);
        item.onclick = async () => {
            document.querySelectorAll('.stamp-item').forEach(s=>s.classList.remove('selected'));
            item.classList.add('selected');
            selectedStampNum = i; stampCheck.checked = true;
            if(uploadedFiles.length > 0) await autoProcess(); 
        };
    }

    stampCheck.onchange = async () => { if(uploadedFiles.length > 0) await autoProcess(); };

    const uploadBtn = document.getElementById('uploadBtn');
    const statusBar = document.getElementById('statusBar');
    const dlBtn = document.getElementById('downloadBtn');
    const previewArea = document.getElementById('previewArea');
    const fileInput = document.createElement('input');
    fileInput.type = 'file'; fileInput.multiple = true; fileInput.accept = 'image/*';
    uploadBtn.onclick = () => fileInput.click();

    fileInput.onchange = async (e) => {
        uploadedFiles = Array.from(e.target.files);
        if(uploadedFiles.length === 0) return;
        previewArea.innerHTML = '';
        uploadedFiles.forEach(f => {
            const reader = new FileReader();
            reader.onload = (ev) => {
                previewArea.innerHTML += `<div class="preview-item"><img src="${ev.target.result}"></div>`;
            };
            reader.readAsDataURL(f);
        });
        await autoProcess();
    };

    async function autoProcess() {
        const container = document.getElementById('resultContainer');
        clearImageCache(); // 处理前先清理旧缓存
        container.innerHTML = '';
        dlBtn.style.display = 'none'; uploadBtn.style.display = 'none';
        statusBar.style.display = 'block'; statusBar.className = 'status-bar active';

        frameFile = await new Promise(res => {
            const img = new Image();
            img.onload = () => res("边框.png");
            img.onerror = () => res("方框.png");
            img.src = "边框.png";
        });

        for(let i=0; i<uploadedFiles.length; i++) {
            statusBar.innerText = `处理中 ${i+1}/${uploadedFiles.length}`;
            const blob = await processImg(uploadedFiles[i]);
            allBlobs.push(blob);
            const url = URL.createObjectURL(blob);
            activeObjectURLs.push(url); // 记录 URL 待清理
            
            const d = new Date();
            const timeStr = `${d.getHours().toString().padStart(2,'0')}:${d.getMinutes().toString().padStart(2,'0')}`;
            const card = document.createElement('div');
            card.className = 'result-card';
            card.innerHTML = `<div class="poster-box"><img class="result-img" src="${url}"><img class="frame-overlay" src="${frameFile}"></div><div class="info-time">${timeStr}</div>`;
            container.appendChild(card);
            await new Promise(r => setTimeout(r, 10));
        }

        // 修改按钮文字：多张为批量下载，一张为立即下载
        dlBtn.innerText = uploadedFiles.length > 1 ? "一键批量下载" : "立即下载图片";
        statusBar.innerText = "处理完成";
        statusBar.className = 'status-bar active done';
        dlBtn.style.display = 'block';
        setTimeout(() => { uploadBtn.style.display = 'block'; statusBar.style.display = 'none'; }, 2000);
    }

    async function processImg(file) {
        return new Promise(resolve => {
            const img = new Image();
            const src = URL.createObjectURL(file);
            img.src = src;
            img.onload = async () => {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                canvas.width = currentW; canvas.height = currentH;
                const scale = Math.max(canvas.width/img.width, canvas.height/img.height);
                const w = img.width * scale, h = img.height * scale;
                ctx.drawImage(img, (canvas.width-w)/2, (canvas.height-h)/2, w, h);
                if(stampCheck.checked && selectedStampNum) {
                    const stamp = new Image();
                    stamp.src = `限定${selectedStampNum}.png`; 
                    await new Promise(r => { stamp.onload = r; });
                    const sw = canvas.width * 0.85;
                    const sh = (stamp.height/stamp.width) * sw;
                    ctx.drawImage(stamp, (canvas.width-sw)/2, (canvas.height-sh)/2 + (canvas.height*0.07), sw, sh);
                }
                URL.revokeObjectURL(src); // 处理完释放上传图的内存
                canvas.toBlob(resolve, 'image/png');
            };
        });
    }

    dlBtn.onclick = () => {
        if(allBlobs.length === 1) {
            // 单张立即下载
            const a = document.createElement('a');
            a.href = activeObjectURLs[0];
            a.download = `LICN_${currentW}x${currentH}.png`;
            a.click();
        } else {
            // 多张批量下载
            allBlobs.forEach((blob, i) => {
                setTimeout(() => {
                    const a = document.createElement('a');
                    a.href = activeObjectURLs[i];
                    a.download = `Poster_${i+1}.png`;
                    a.click();
                }, i * 250);
            });
        }
    };

    document.getElementById('expandBtn').onclick = function() {
        const isExp = document.getElementById('stampWrap').classList.toggle('expand');
        this.innerText = isExp ? '收起 ▲' : '展开 ▾';
    };
</script>
</body>
</html>
